<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Diagnóstico do Ranking ARA</title><style>body{font:18px system-ui;background:#0b1a45;color:white;max-width:680px;margin:8vh auto;padding:20px}button{padding:14px;border:0;border-radius:10px;background:#fbbf24;font-weight:bold}pre{white-space:pre-wrap;background:#132f5d;padding:16px;border-radius:12px}</style><h1>🏆 Diagnóstico do ranking</h1><p>Esta página verifica se a função de servidor foi publicada e consegue responder.</p><button onclick="testar()">Testar conexão</button><pre id="out">Aguardando teste...</pre><script>async function testar(){let o=document.getElementById('out');o.textContent='Consultando função...';try{let r=await fetch('/.netlify/functions/ranking',{cache:'no-store'});let t=await r.text();let j;try{j=JSON.parse(t)}catch(e){throw Error('O endereço retornou HTML ou texto em vez de JSON. A função provavelmente não foi publicada. HTTP '+r.status)}if(!r.ok)throw Error('Erro do servidor HTTP '+r.status+': '+JSON.stringify(j));if(!Array.isArray(j.solo)||!Array.isArray(j.groups))throw Error('Resposta inválida: '+JSON.stringify(j));o.textContent='✅ Função ativa!\nRanking individual: '+j.solo.length+' registro(s).\nRanking de grupos: '+j.groups.length+' registro(s).\nObservação: envio de pontuações só é testado ao terminar uma partida.'}catch(e){o.textContent='❌ Não foi possível conectar.\n'+e.message+'\n\nPublique via repositório Git com netlify/functions e @netlify/blobs, não apenas o HTML.'}}testar()</script></html>
